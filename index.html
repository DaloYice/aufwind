<!doctype html>
<html lang="de" data-theme="dark" data-accent="limette" data-design="sport">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aufwind</title>
  <meta name="description" content="Fitness für jeden Einstieg – kleine tägliche Challenges morgens und abends.">
  <meta name="theme-color" content="#0b0c0f">
  <script>
    // Hell/Dunkel und Akzentfarbe vor dem ersten Zeichnen setzen (kein Aufblitzen)
    try {
      const st = JSON.parse(localStorage.getItem('aufwind:v1') || '{}').settings || {};
      const r = document.documentElement;
      if (st.theme) r.dataset.theme = st.theme === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : st.theme;
      if (st.accent) r.dataset.accent = st.accent;
      if (st.design) r.dataset.design = st.design;
    } catch { /* ohne gespeicherte Einstellungen */ }
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="view" class="view" tabindex="-1"></main>
  <nav id="tabbar" class="tabbar" hidden aria-label="Hauptnavigation">
    <a href="#/heute" data-tab="heute"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Heute</a>
    <a href="#/uebungen" data-tab="uebungen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>Übungen</a>
    <button type="button" class="tab-go" id="tab-go" aria-label="Jetzt starten"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg></button>
    <a href="#/fortschritt" data-tab="fortschritt"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Fortschritt</a>
    <a href="#/profil" data-tab="profil"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profil</a>
  </nav>
  <div id="overlay" class="overlay" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
